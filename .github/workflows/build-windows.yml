# ============================================================
# GitHub Actions —— Windows 版自动构建
#
# 推送到 GitHub 后自动在 Windows runner 上打包，
# 产物作为 artifact 可下载（无需在本地装 Windows）。
#
# 关键：打包后会在 runner 上真实运行一次产物自检（--selftest），
#       把「能不能跑」这道关卡卡在云端，而不是等用户下载后才发现问题。
#
# 手动触发：Actions → 构建 Windows 版 → Run workflow
# ============================================================
name: 构建 Windows 版

on:
  push:
    branches: [main, master]
    paths:
      - 'desktop_app.py'
      - 'desktop_app.spec'
      - 'server.py'
      - 'data_sources.py'
      - 'backfill_history.py'
      - 'build_inline.py'
      - 'index.template.html'
      - 'requirements.txt'
      - 'utf8_stdout.py'
      - 'vendor/echarts.min.js'
  workflow_dispatch:      # 允许手动触发

jobs:
  build-windows:
    # windows-latest = Windows Server 2022，Build 20348
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 依赖清单见 requirements.txt，版本已固定，保证构建可复现。
          # pythonnet 提供 clr / System，Windows 的 edgechromium、winforms 后端都依赖它。
          pip install -r requirements.txt

      - name: 生成自包含页面
        run: python build_inline.py

      - name: 打包
        run: pyinstaller --noconfirm desktop_app.spec

      - name: 校验产物
        shell: pwsh
        run: |
          $exe = "dist/AStockDashboard/AStockDashboard.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "❌ 未生成 exe"
            exit 1
          }
          $size = (Get-Item $exe).Length
          Write-Host "✅ exe 生成成功，大小: $([math]::Round($size/1MB,1)) MB"

      - name: 产物自检（在 Windows 上真实运行）
        shell: pwsh
        run: |
          $exe = "dist/AStockDashboard/AStockDashboard.exe"
          $report = Join-Path $env:APPDATA "AStockDashboard\selftest.txt"
          # 清掉旧报告，确保读到的一定是本次运行产生的
          if (Test-Path $report) { Remove-Item $report -Force }
          # 该 exe 是 GUI 子系统程序（console=False），PowerShell 直接调用不会等待它结束，
          # $LASTEXITCODE 会取到空值 —— 必须用 Start-Process -Wait 显式等待并取退出码。
          $proc = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
          $code = $proc.ExitCode
          if (Test-Path $report) {
            Write-Host "----- 自检报告 -----"
            Get-Content $report -Encoding UTF8 | ForEach-Object { Write-Host $_ }
          } else {
            Write-Host "⚠️  未找到自检报告文件: $report"
          }
          Write-Host "----- 自检退出码: $code -----"
          if ($code -ne 0) {
            Write-Host "❌ 产物自检未通过，构建判定为失败"
            exit 1
          }
          Write-Host "✅ 产物自检通过"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: AStockDashboard-Windows-x64
          path: dist/AStockDashboard/
          retention-days: 30

      - name: 压缩为 zip（便于分发）
        shell: pwsh
        run: |
          Compress-Archive -Path dist/AStockDashboard -DestinationPath "AStockDashboard-Windows-x64.zip"
          Write-Host "zip 大小: $((Get-Item 'AStockDashboard-Windows-x64.zip').Length) 字节"

      - name: 上传 zip
        uses: actions/upload-artifact@v4
        with:
          name: AStockDashboard-Windows-x64-zip
          path: "AStockDashboard-Windows-x64.zip"
          retention-days: 30
